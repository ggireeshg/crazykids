<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">

    <style>

/* ===== BASIC ===== */
body{
margin:0;
font-family:Arial;
background:#fff7c2;
}

h2{
text-align:center;
margin:20px 0;
}

/* ===== HEADER ===== */
header{
background:#ffa726;
padding:15px;
text-align:center;
}

nav{
background:#2ec4b6;
padding:10px;
text-align:center;
}

nav a{
color:white;
margin:10px;
text-decoration:none;
font-weight:bold;
}

/* ===== CAROUSEL ===== */
.carousel-container{
position:relative;
max-width:1200px;
margin:30px auto;
overflow:hidden;
}

.carousel{
display:flex;
gap:20px;
transition:transform 0.5s ease;
}

.card{
min-width:260px;
background:white;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
overflow:hidden;
}

/* ===== THUMBNAIL ===== */
.thumb{
position:relative;
cursor:pointer;
}

.thumb img{
width:100%;
height:180px;
object-fit:cover;
}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:40px;
background:rgba(0,0,0,0.6);
color:white;
border-radius:50%;
width:60px;
height:60px;
display:flex;
align-items:center;
justify-content:center;
}

/* ===== ARROWS ===== */
.arrow{
position:absolute;
top:40%;
background:black;
color:white;
border:none;
font-size:30px;
padding:10px;
cursor:pointer;
z-index:10;
}

.left{ left:0; }
.right{ right:0; }

/* ===== FOOTER ===== */
footer{
background:#ffa726;
text-align:center;
padding:10px;
color:white;
margin-top:30px;
}


.video-scroll:hover{
animation-play-state: paused;
}
.testimonial-page{
max-width:1200px;
margin:30px auto;
padding:20px;
}

.video-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.video-card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
text-align:center;
}

.video-card iframe,
.video-card video{
width:100%;
height:200px;
border-radius:10px;
}

.stars{
color:#ffc107;
font-size:20px;
margin-top:10px;
}

.testimonial-images{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.testimonial-images img{
width:100%;
border-radius:12px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.whatsapp-btn{
display:block;
width:250px;
margin:40px auto;
padding:15px;
background:#25D366;
color:white;
text-align:center;
border-radius:10px;
font-weight:bold;
text-decoration:none;
}

@keyframes scrollVideos{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

</style>
</head>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg">
</div>

<script>

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

function openLightbox(img){
lightbox.style.display="flex";
lightboxImg.src=img.src;
}

lightbox.onclick=function(){
lightbox.style.display="none";
}

</script>

<script>

let index=0;

function move(direction){
const carousel=document.getElementById("carousel");
const cardWidth=280;

index+=direction;

if(index<0) index=0;

carousel.style.transform="translateX("+(-index*cardWidth)+"px)";
}

/* play video */
function play(el,id){
el.innerHTML =
'<iframe width="100%" height="180" src="https://www.youtube.com/embed/'+id+'?autoplay=1" frameborder="0" allowfullscreen></iframe>';
}

</script>
